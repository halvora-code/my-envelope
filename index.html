<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>envelope</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <header class="hero">
            <h1>A message for you!</h1>
            <p class="tagline">Shake for a nice note!</p>
        </header>
        <main>
            <section class="note-card">
                <div class="note" id="note">
                    <img class="scene" src="bluenvelope.jpg" alt="an envelope"/>
                </div>
                <button id="shake">Shake the envelope</button>
                <p class="message" id="message">Press the button and see what happens</p>
            </section>
            <footer>
                <p>sent by me, just a little something nice </p>
            </footer>
            <script src="script.js"></script>
        </main>
    </body>
    </html>
