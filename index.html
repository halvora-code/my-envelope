<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>snowglobe</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <header class="hero">
            <h1>My Snow Globe!</h1>
            <p class="tagline">Shake for a little kindness!</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img class="scene" src="snowglobe.png" alt="a snowglobe"/>
                </div>
                <button id="shake">Shake the globe</button>
                <p class="message" id="message">Press the button and see what happens</p>
            </section>
            <footer>
                <p>made by me, in the snow. </p>
            </footer>
            <script src="script.js"></script>
        </main>
    </body>
    </html>
